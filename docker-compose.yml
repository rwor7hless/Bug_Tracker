version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: bugreport
      POSTGRES_USER: bugreport
      POSTGRES_PASSWORD: bugreport
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bugreport"]
      interval: 5s
      timeout: 5s
      retries: 10

  warp:
    image: caomingjun/warp
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv4.conf.all.src_valid_mark=1
    environment:
      - WARP_SLEEP=2
    volumes:
      - warp-data:/var/lib/cloudflare-warp
    ports:
      - "${PORT:-3000}:3000"

  app:
    build: .
    restart: unless-stopped
    network_mode: service:warp
    depends_on:
      postgres:
        condition: service_healthy
      warp:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://bugreport:bugreport@postgres:5432/bugreport
      JWT_SECRET: ${JWT_SECRET}
      BOT_TOKEN: ${BOT_TOKEN}
      PORT: 3000
    env_file:
      - .env
    volumes:
      - uploads:/app/uploads

volumes:
  pgdata:
  uploads:
  warp-data:
