version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: bugreport
      POSTGRES_USER: bugreport
      POSTGRES_PASSWORD: bugreport
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bugreport"]
      interval: 5s
      timeout: 5s
      retries: 10

  warp:
    image: caomingjun/warp
    container_name: warp
    restart: unless-stopped
    ports:
      - "40001:1080"
      - "${PORT:-3000}:3000"
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
    environment:
      - WARP_SLEEP=2
    healthcheck:
      test: ["CMD-SHELL", "curl -sx socks5://localhost:1080 --connect-timeout 5 -o /dev/null -w '%{http_code}' https://www.google.com | grep -q '200'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  app:
    build: .
    restart: unless-stopped
    network_mode: service:warp
    depends_on:
      postgres:
        condition: service_healthy
      warp:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://bugreport:bugreport@postgres:5432/bugreport
      JWT_SECRET: ${JWT_SECRET}
      BOT_TOKEN: ${BOT_TOKEN}
      PORT: 3000
    env_file:
      - .env
    volumes:
      - uploads:/app/uploads

volumes:
  pgdata:
  uploads:
